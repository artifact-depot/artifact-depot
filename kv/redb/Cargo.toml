[package]
name = "depot-kv-redb"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "depot_kv_redb"
path = "src/lib.rs"

[dependencies]
depot-core = { path = "../../core" }
async-trait = "0.1"
blake3 = "1"
futures = "0.3"
# Held at 2.x: redb 3.0+ removed support for the v2 on-disk file format and
# reads only v3. depot opens existing databases with Database::create() and
# never calls Database::upgrade(), so every deployed single-node store is v2.
# Moving to redb 4 would make depot fail to open the DB on restart until an
# operator runs a one-time v2->v3 upgrade from a redb-2.6 build. Do that
# migration in a dedicated PR with an operator runbook, not a group bump.
redb = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
