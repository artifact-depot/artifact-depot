# Example Helm chart reorganization rules for `depot-bench reorg-helm`.
#
# Drains first-party charts out of the wrong repositories by version class,
# leaving third-party charts (cilium, ingress-nginx, minio, …) untouched.
# Dry-run by default; `--apply move,delete,verify-delete` executes.
#
#   depot-bench reorg-helm --url https://depot.example.com \
#     --username admin --password ... --rules helm-reorg.example.toml
#   # review the plan, then:
#   depot-bench reorg-helm ... --rules helm-reorg.example.toml --apply move,delete

# Chart names starting with any of these prefixes are first-party and in scope.
# Everything else is third-party and is never moved, deleted, or verified.
first_party = [
    "myriad",
    "myriad-uui",
    "quantum-orchestrator",
    "observability",
    "cba-client",
    "flexsync",
    "garage",
    "perfsuite",
    "nextgen",
    "qkp-ds-kvgen",
]

# Retired chart names (exact match): charts renamed away, whose old-name copies
# are stale and should be purged wholesale — every version, every source repo,
# regardless of version class. The Helm analogue of the docker reorg's
# `retired_prefixes`. Checked ahead of the first-party gate, since a retired
# name is usually not in the first-party prefix list above (so it would
# otherwise be mistaken for a third-party chart and left behind). Empty here:
# the current data has only `quantum-orchestrator`, no leftover `orchestrator`.
retired_names = []

# Release authority for the `delete-if-on-authority` action. A released (x.y.z)
# chart is dropped from a source repo only if this UPSTREAM registry already
# serves the identical digest. It is queried DIRECTLY — never via a local cache
# repo, which would give an incomplete answer and warm the cache (forbidden:
# caches are usage records). Credentials come from the UPSTREAM_USERNAME /
# UPSTREAM_PASSWORD environment variables when `--apply verify-delete` runs.
[authority]
url = "https://insight.example.com"
repo = "helm-release"

# Named version-class regexes, matched against the chart version.
[patterns]
released   = '^\d+\.\d+\.\d+$'
prerelease = '^\d+\.\d+\.\d+-(dev|rc)\.\d+$'
branch     = '^\d+\.\d+\.\d+-(develop|main|master)$'
# Obvious throwaway versions to delete outright: the `deleteme` markers, the
# `-0-9-0` mangling, `dryrun` test tags, and malformed CI double-versions like
# `1.0.0-0.9.1-dev.14` (a released base with another version string appended).
junk       = '(deleteme|dryrun|^1\.0\.0-0-9-0$|^\d+\.\d+\.\d+-\d+\.\d+\.\d+-(dev|rc)\.\d+$)'

# --- helm-external: the de-facto dumping ground -----------------------------
# First-party prereleases go to helm-prerelease; branch tags likewise; released
# versions are dropped locally once confirmed on the authority; junk deleted.
# (CI / developer-branch builds like `1.0.0-jss-dev-4` match no rule and land
# in the UNCLASSIFIED bucket — reported, never touched.)
[[groups]]
source = "helm-external"

  [[groups.rules]]
  class = "junk"
  action = "delete"

  [[groups.rules]]
  class = "released"
  action = "delete-if-on-authority"

  [[groups.rules]]
  class = "prerelease"
  dest = "helm-prerelease"

  [[groups.rules]]
  class = "branch"
  dest = "helm-prerelease"

# --- helm-internal: misfiled prereleases; drain then retire -----------------
# A drained repo destined for retirement: it must end empty of first-party
# charts, so it needs the junk rule too (catches the leftover dryrun tag) or
# retirement stays blocked by an unclassified straggler.
[[groups]]
source = "helm-internal"
retire = true

  [[groups.rules]]
  class = "junk"
  action = "delete"

  [[groups.rules]]
  class = "prerelease"
  dest = "helm-prerelease"

  [[groups.rules]]
  class = "branch"
  dest = "helm-prerelease"

# --- helm-development: mostly correct; sweep out stray prereleases ----------
# drain = false: this is a SWEPT repo, not drained. Only versions a rule matches
# (stray prereleases) leave; the CI and developer-branch builds that make up the
# bulk of this repo are meant to stay, so they are counted as RETAINED rather
# than flagged as unclassified.
[[groups]]
source = "helm-development"
drain = false

  [[groups.rules]]
  class = "prerelease"
  dest = "helm-prerelease"

  [[groups.rules]]
  class = "junk"
  action = "delete"
