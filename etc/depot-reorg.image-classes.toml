# First-party Docker image classification for the `released` (x.y.z) rule.
#
# Generated from each project's `.gitlab-ci.yml` publish_release job on
# gitlab.mdh.quantum.com (default branch `develop`):
#
#   myriad        myriad/myriad         -O ${DOCKER_EXTERNAL}=release(insight)  / ${DOCKER_INTERNAL}=release_aux
#   qkp           quantum/qkp           -O ${DOCKER_REPO}=release(insight)      / ${DOCKER_REPO_AUX}=release_aux
#   orchestrator  quantum/orchestrator  -O ${DOCKER_EXTERNAL}=release(insight)  / ${DOCKER_INTERNAL}=release_aux
#
# The split applies ONLY to x.y.z release tags (prerelease/latest publish every
# image to the prerelease repo regardless). An image listed here as `insight`
# ships to the customer-facing upstream insight registry (mirrored by the
# docker-insight cache); its copies in the drained source repos are redundant.
# An image listed as `aux` belongs in docker-release-aux.
#
# IMPORTANT — these are a snapshot of the *current* pipeline. Tags in the source
# repos were built over the projects' whole history, under older pipeline rules,
# so an image may be absent here (added/removed/renamed since). Any x.y.z tag
# whose image is on NEITHER list is reported as "Needs classification" (never
# moved or deleted) so it can be triaged and added to the right list. Regenerate
# from the CI files when the pipeline changes.

# ---- INSIGHT images (x.y.z → upstream insight `docker-release`) --------------
# Source copies are redundant; dropped only when the same digest is confirmed
# upstream, and never out of the cache repo itself.
insight_images = [
