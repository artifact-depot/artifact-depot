# Example rules for `depot-bench reorg`.
#
# Everything is data-driven from this file — no repo names, image prefixes, or
# tag conventions are compiled into depot. Run a dry run first:
#
#   depot-bench reorg --url https://depot-dev.lab.mdh.quantum.com \
#       --username admin --password ... --rules etc/depot-reorg.example.toml
#
# then add --apply to execute (or --copy for a non-destructive pass that uses
# staging/copy for moves and skips all deletes/purges).

# --------------------------------------------------------------------------
# Reusable named patterns. Reference any by name from a rule's `match`, or
# inline a regex there. Patterns are auto-anchored (^(?:…)$), so write them
# without ^ / $. Shared across every group below (and future helm/raw groups).
# --------------------------------------------------------------------------
# Optional: read last-accessed (usage) data from this repo to annotate the
# dry-run plan — typically the docker group/proxy, so each tag's *live* atime is
# reported (the stale source member resolves last in the group). Report only; it
# never changes what gets moved/deleted. Annotations: [pulled DATE] if the proxy
# served the tag, or [absent from <repo>] (a "stale, safe to drop" hint).
usage_repo = "docker"

[patterns]
released   = '\d+\.\d+\.\d+'
prerelease = '\d+\.\d+\.\d+-(dev|rc)\.\d+'
develop    = 'develop'
ci         = 'ci-.+-\d+'
developer  = '[a-z][a-z0-9]*-\d+'

# --------------------------------------------------------------------------
# One group per artifact format. Only `docker` is supported by the server-side
# movers today; helm/raw groups will reuse the same [patterns] once those land.
# --------------------------------------------------------------------------
[[group]]
format               = "docker"
source_repos         = ["docker-internal", "docker-external"]
first_party_prefixes = ["myriad/", "qkp/", "orchestrator/"]
purge_repos          = ["docker-upstream"]   # dead cache (upstream gone): emptied wholesale

  # Ordered; first matching rule wins.

  # x.y.z-dev.n / -rc.n  → prerelease repo
  [[group.rule]]
  match  = "prerelease"
  action = "move"
  dest   = "docker-prerelease"

  # x.y.z released → reconcile against insight (the canonical release registry,
  # a cache we never write to). Insight-presence is the primary-vs-supplementary
  # discriminator, so no hand-maintained image list is needed:
  #   absent from insight            → supplementary → move to docker-release-aux
  #   present, same content digest   → redundant dup → delete from source
  #   present, different digest      → not the same image → left for review
  [[group.rule]]
  match  = "released"
  action = "reconcile"
  check  = "docker-insight"
  dest   = "docker-release-aux"

  # rolling develop tag → prerelease repo
  [[group.rule]]
  match  = "develop"
  action = "move"
  dest   = "docker-prerelease"

  # ci-*-<n>  → development-local
  [[group.rule]]
  match  = "ci"
  action = "move"
  dest   = "docker-development-local"

  # <name>-<n> (e.g. slord-79) → development-local
  [[group.rule]]
  match  = "developer"
  action = "move"
  dest   = "docker-development-local"

  # Catch-all: anything no rule matched (dash-versions, platform-suffixed builder
  # tags, branch tags, …) → development. Unused ones age out via that repo's
  # cleanup_max_unaccessed_days; anything still pulled keeps its atime fresh.
  [[group.rule]]
  match  = '.*'
  action = "move"
  dest   = "docker-development"
