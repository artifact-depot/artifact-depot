# Example rules for `depot-bench reorg`.
#
# Re-files first-party Docker images out of the source repos and into the
# right destination repo based on each tag's shape. Run a dry run first:
#
#   depot-bench reorg --url https://repository.mdh.quantum.com \
#       --username admin --password ... --rules etc/depot-reorg.example.toml
#
# then add --apply to perform the moves (or --copy for a non-destructive pass
# that leaves the source intact).

# Repositories to drain of first-party images.
source_repos = ["docker-internal", "docker-upstream", "docker-external"]

# Only images whose name starts with one of these prefixes are touched;
# everything else (third-party content) is left in place.
first_party_prefixes = ["myriad/", "qkp/", "orchestrator/"]

# Released x.y.z images that are supplementary (not customer-facing) route to
# dest.released_aux instead of dest.released. These are the images the projects'
# .gitlab-ci.yml publish jobs send to ${DOCKER_INTERNAL} (release_aux) rather
# than ${DOCKER_EXTERNAL} (release). Keep this list in sync with those jobs.
aux_images = [
    "myriad/test_exec_web",
    "myriad/uncrustifier",
]

[dest]
# x.y.z  (released semver), customer-facing
released = "docker-insight"
# x.y.z  (released semver), supplementary
released_aux = "docker-release-aux"
# x.y.z-dev.n / x.y.z-rc.n  (prerelease semver)
prerelease = "docker-prerelease"
# the rolling `develop` tag
develop = "docker-prerelease"
# ci-*-<n>  (CI builds)
ci = "docker-development-local"
# <name>-<n>  (developer builds, e.g. slord-79)
developer = "docker-development-local"
