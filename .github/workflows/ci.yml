name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEPOT_INSTRUMENT_FRONTEND: "1"
  # Optional registry mirror for base images, configured per-environment as a
  # repository/org Actions variable (empty -> pull from Docker Hub directly).
  # Kept out of the source so no environment-specific host is hardcoded here.
  DOCKER_MIRROR: ${{ vars.DOCKER_MIRROR }}

jobs:
  ci:
    name: lint - build - test
    runs-on: arc-amd64
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the shared toolchain stage from the root Dockerfile — the same
      # `builder` the release image and dev container are built on, so CI,
      # dev, and releases can never drift on the Node/Rust toolchain.
      - name: Build CI toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: builder
          load: true
          tags: depot-dev:ci
          # No APT_MIRROR: the builder is Debian (the apt mirror was an Ubuntu
          # path for the old devcontainer). Debian apt uses deb.debian.org
          # directly, the same as the release-build job below.
          build-args: |
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}

      - name: Start container
        run: |
          docker run -d --name dev \
            --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR \
            -e DEPOT_INSTRUMENT_FRONTEND \
            depot-dev:ci \
            sleep infinity

      - name: Start dockerd inside container
        run: |
          # --insecure-registry 127.0.0.0/8 lets the docker-auth integration
          # test (and any future loopback registry tests) talk to a depot
          # bound on localhost without TLS chain validation against a
          # self-signed cert. It only relaxes verification for loopback IPs.
          docker exec -d dev sh -c 'dockerd --insecure-registry 127.0.0.0/8 >/var/log/dockerd.log 2>&1'
          docker exec dev sh -c '
            for i in $(seq 1 30); do
              docker info >/dev/null 2>&1 && exit 0
              sleep 1
            done
            echo "dockerd did not become ready"; tail -50 /var/log/dockerd.log; exit 1
          '

      # Lint + build + full test suite, exactly as a developer runs it
      # locally (CLAUDE.md: "run `make` to lint, build, and test
      # everything"). `make` resolves to `all` -> `test`, which depends on
      # notices, the debug build (frontend included via build.rs), all five
      # lint checks, then cargo/UI/DynamoDB/docker-auth tests. dockerd is
      # already running and DYNAMODB_LOCAL_DIR is baked into the image, so
      # the e2e/integration suites find what they need.
      - name: Lint, build, and test (make)
        run: docker exec dev make

      - name: Stop container
        if: always()
        run: docker rm -f dev || true

  release-build:
    name: build release image (${{ matrix.platform }})
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
          - platform: linux/arm64
            runner: arc-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build counter (commit count) is accurate;
          # the default shallow clone would always report 1.
          fetch-depth: 0

      - name: Compute build counter
        id: counter
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            BUILD_COUNTER=${{ steps.counter.outputs.count }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-manifest:
    name: combine multi-arch manifest
    needs: release-build
    runs-on: arc-amd64
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
